<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SagarBarcode PWA</title>
<link rel="manifest" href="manifest.json">

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js");
    });
  }
</script>
  
<link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
<!-- Purani scan library hata di gayi hai taaki Native HD API use ho sake -->
</head>

<body>

<header>
  <h1>SagarBarcode Scanner</h1>
</header>

<nav>
  <button class="tabBtn activeTab" data-tab="barcodeTab">Barcode</button>
  <button class="tabBtn" data-tab="qrTab">QR Code</button>
</nav>

<section id="barcodeTab" class="tabSection" style="display:block;">
  <div class="card">
    <strong>Barcode Scanner</strong>
    <div>Total Scans: <span id="totalCount">0</span></div>
  </div>

  <div class="card">
    <!-- Hidden elements (purane wale chhod diye hain taaki design disturb na ho) -->
    <div id="reader" style="display:none;"></div>
    
    <button id="startScan" autofocus>Start Scan</button>

    <div id="entryFields" style="display:none;">
      <input id="barcode" placeholder="Serial Number" autocomplete="off">
      <input id="photo" placeholder="Photo Number" autocomplete="off">
      <textarea id="remark" placeholder="Remark" rows="2"></textarea>
      <input id="datetime" readonly>
      <button id="submitBtn">Submit</button>
      <button id="retryBtn">Retry</button>
    </div>
  </div>

  <div class="table-wrapper">
    <table id="table">
      <tr>
        <th>Serial</th>
        <th>Photo</th>
        <th>Remark</th>
        <th>Date & Time</th>
        <th>Delete</th>
      </tr>
    </table>
  </div>

  <button id="copyBtn">Copy Table</button>
  <button id="exportBtn">Export CSV</button>
  <button id="shareWaBtn" style="background: #25D366; color: white;">Share on WhatsApp 🟢</button>
  <button id="syncBtn">Update Google Sheet</button>
</section>

<section id="qrTab" class="tabSection">
  <div class="card">
    <strong>QR Code Scanner</strong>
  </div>
  
  <div id="qr-reader" style="display:none;"></div>
  <button id="startQR">Start QR Scan</button>
  
  <input id="qrField" placeholder="Scanned QR Data" readonly style="margin-top: 15px;">
  
  <button id="copyQR">Copy QR Data</button>
  <button id="exportQR">Export QR CSV</button>
  <button id="shareWaQRBtn" style="background: #25D366; color: white;">Share QR on WhatsApp 🟢</button>
</section>

<!-- ============================================== -->
<!-- CAMERA PREVIEW (Peeche chalne wala asli HD camera) -->
<!-- ============================================== -->
<div id="cameraContainer" class="hidden">
    <video id="nativeVideo" autoplay playsinline></video>
</div>

<!-- ============================================== -->
<!-- PREMIUM NATIVE SCANNER OVERLAY (Aapki Image Jaisa) -->
<!-- ============================================== -->
<div id="scannerOverlay" class="hidden">
  <!-- Top Navigation Bar -->
  <div class="top-nav">
    <button id="closeScannerBtn">❮</button>
    <button id="helpBtn">?</button>
  </div>

  <!-- Instruction Text -->
  <div class="instruction-text">Put the code into the frame.</div>

  <!-- Square Scanning Frame with Corners & Laser -->
  <div class="scan-frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="laser"></div>
  </div>

  <!-- Vertical Zoom Slider (Right Side) -->
  <div class="zoom-container">
    <span class="zoom-icon">⊕</span>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
    <span class="zoom-icon">⊖</span>
  </div>

  <!-- Bottom Glassmorphism Bar (Flashlight, etc.) -->
  <div class="bottom-bar">
    <div class="nav-item">
      <span class="icon">🖼️</span>
      <span>Scan Image</span>
    </div>
    <div class="nav-item" id="flashToggleBtn">
      <span class="icon">🔦</span>
      <span id="flashText">Flashlight</span>
    </div>
    <div class="nav-item">
      <span class="icon">📑</span>
      <span>Batch Scan</span>
    </div>
  </div>
</div>

<footer>Design by – Sagar Herole</footer>

<script src="app.js"></script>
  <script>
  // Yeh check karta hai ki aapka browser Service Worker ko support karta hai ya nahi
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // Yahan hum aapki sw.js file ko link kar rahe hain
      navigator.serviceWorker.register('./sw.js')
        .then((registration) => {
          console.log('Service Worker ekdum perfect lag gaya!', registration.scope);
        })
        .catch((error) => {
          console.log('Service Worker mein error aaya:', error);
        });
    });
  }
  </script>
  
</body>
</html>
